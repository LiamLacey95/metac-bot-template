name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository activity. A bot that
# stops forecasting does not fail loudly - it just scores 0 on every question it misses, and
# since prize money is proportional to the SQUARE of summed peer score, missed questions are
# the most expensive possible failure. This commits a timestamp weekly so the schedules survive
# a quiet stretch.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch heartbeat and push
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "chore: keepalive [skip ci]"
          git push
